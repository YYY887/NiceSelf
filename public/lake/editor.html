<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>语雀编辑器</title>
  <script>
    try {
      document.documentElement.classList.toggle('dark', parent.document.documentElement.classList.contains('dark'));
    } catch { /* The parent component will synchronize the theme after load. */ }
  </script>
  <link rel="stylesheet" href="./doc.css"/>
  <link rel="stylesheet" href="./antd.css"/>
  <link rel="stylesheet" href="./editor-dark.css"/>
  <style>
    html { color-scheme: light; }
    html, body { height: 100%; margin: 0; background: #fff; caret-color: #111; }
    html:not(.dark) .ne-engine,
    html:not(.dark) .ne-engine * {
      caret-color: #111 !important;
    }
    body { position: relative; overflow: hidden; }
    #root { height: 100%; }
    .ne-engine,
    .ne-engine-view,
    .ne-ui-overlay,
    textarea,
    input,
    #doc-title {
      caret-color: #111 !important;
      color: #1f1f1f;
      cursor: text;
    }
    .ne-ui-toolbar,
    .ne-ui-inner-toolbar {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      display: flex !important;
      justify-content: center !important;
      width: 100% !important;
    }
    .ne-editor > .ne-ui { position: relative !important; }
    .ne-layout-mode-fixed .ne-editor-wrap,
    .ne-layout-mode-adapt .ne-editor-wrap {
      justify-content: center !important;
    }
    .title-wrap {
      position: relative;
      top: auto;
      left: auto;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 1.15rem 3rem 0.45rem;
      text-align: left;
      pointer-events: none;
    }
    #doc-title {
      display: block;
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #1f1f1f;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.3;
      text-align: left;
      pointer-events: auto;
      caret-color: #111;
      cursor: text;
    }
    #doc-title::placeholder { color: #c4c4c4; }
    .hint { margin: 0.4rem 0 0; color: #8c8c8c; font-size: 13px; text-align: left; }
    .ne-layout-mode-fixed .ne-editor-wrap,
    .ne-layout-mode-adapt .ne-editor-wrap {
      padding: 0 !important;
      height: 100%;
    }
    .ne-layout-mode-fixed .ne-engine,
    .ne-layout-mode-adapt .ne-engine {
      padding: 0.35rem 3rem 80px !important;
      max-width: 860px !important;
      min-height: calc(100% - 8px);
      margin: 0 auto !important;
    }
    ne-card[data-card-name='file'],
    ne-card[data-card-name='localdoc'],
    .ne-card-file {
      cursor: pointer;
    }
    .ne-layout-mode-fixed .ne-editor-wrap-content,
    .ne-layout-mode-adapt .ne-editor-wrap-content,
    .ne-layout-mode-fixed .ne-editor-outer-wrap-box,
    .ne-layout-mode-adapt .ne-editor-outer-wrap-box {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      flex: 0 1 860px !important;
      min-width: 0 !important;
      max-width: 860px !important;
      width: 100% !important;
      margin: 0 auto !important;
    }
    #block-menu {
      display: none;
      position: fixed;
      z-index: 10000;
      min-width: 184px;
      padding: 6px 0;
      border: 1px solid #ececec;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 28px rgb(0 0 0 / 14%);
      color: #262626;
      font-size: 13px;
      line-height: 1.4;
    }
    #block-menu button {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 8px 18px;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    #block-menu button:hover,
    #block-menu button:focus {
      background: #f5f5f5;
      outline: none;
    }
    #block-menu button[data-cmd="delete"]:hover {
      background: #f5f5f5;
    }
    #block-menu .block-menu-sep {
      height: 1px;
      margin: 6px 0;
      background: #eee;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="title-wrap">
    <input id="doc-title" placeholder="请输入标题" />
    <p class="hint">直接输入正文，也可使用工具栏或输入 / 插入内容</p>
  </div>
  <script src="./editor-bridge.js"></script>
  <script src="./react.production.min.js"></script>
  <script src="./react-dom.production.min.js"></script>
  <script src="./CodeMirror.js"></script>
  <script src="./kitchen.js"></script>
  <script src="./doc.umd.js"></script>
</body>
</html>
