name = "qianqiu-myself"
main = "worker/src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 自定义域名：把上面两行注释打开，改成自己的域名后重新部署。
# 一键部署（Deploy to Cloudflare）不要填这里，会在部署页让你选域名的。
# [[routes]]
# pattern = "example.com/*"
# zone_name = "example.com"

# D1 与 R2 不需要手动创建：一键部署会读这段配置，自动新建资源并回填 database_id。
# database_id 全 0 是占位值，部署完成后由部署流程（或 scripts/capture-deploy.mjs）替换。
[[d1_databases]]
binding = "DB"
database_name = "qianqiu-myself"
database_id = "be4e9f86-97b6-415b-85af-5f2e68019647"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "qianqiu-uploads"

# PUBLIC_URL 为站点对外地址，用于同源校验与 GitHub 回调；部署后必须是真实地址。
# 留空则回落到请求自身的 origin，只适合临时验证。
[vars]
PUBLIC_URL = "https://qianqiu.dev"
SESSION_DAYS = "30"
